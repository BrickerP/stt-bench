[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-bench"
version = "0.1.0"
description = "Local STT benchmarking: Whisper (batch) vs Deepgram (streaming)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.9.0",
    "openai>=1.54.0",
    "deepgram-sdk>=3.8.0",
    "jiwer>=3.0.0",
    "sacrebleu>=2.4.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "pyyaml>=6.0.0",
    "websockets>=13.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
stt-bench = "stt_bench.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["stt_bench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
