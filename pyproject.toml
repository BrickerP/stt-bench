[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-eval-bench"
version = "0.1.1"
description = "Self-hostable STT evaluation toolkit: compare providers on WER, latency, cost, and streaming UX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrickerP" }]
keywords = ["speech-to-text", "benchmark", "stt", "evaluation", "whisper", "deepgram"]
urls = { Homepage = "https://github.com/BrickerP/stt-bench", Repository = "https://github.com/BrickerP/stt-bench" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.9.0",
    "openai>=1.54.0",
    "deepgram-sdk>=3.8.0",
    "jiwer>=3.0.0",
    "sacrebleu>=2.4.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "pyyaml>=6.0.0",
    "websockets>=13.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # Pinned: 0.16.0 (2026-07-23) grew the default rule set from 59 to 413.
    # An open floor let CI install 0.17.0 and fail lint with no code change.
    "ruff==0.17.0",
    "mypy>=1.13.0",
]

[project.scripts]
stt-bench = "stt_bench.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["stt_bench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI (Depends, File, Form) and Typer (Option, Argument) put a marker
# call in the signature. It runs once at import and is not a shared mutable
# default, so B008's suggested rewrite fights the framework API. Immutable
# annotations are already ignored; this covers the mutable ones (Settings,
# UploadFile, Path, list).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "typer.Argument",
    "typer.Option",
]
